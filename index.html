<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FAFAF7" />
    <meta name="description" content="Klarschiff – der Kreuzfahrt-Planer von @wolken.wanderer. Offline nutzbar." />
    <title>Klarschiff</title>

    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Klarschiff" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet" />

    <style>
      html, body, #root { margin: 0; padding: 0; background: #FAFAF7; }
      * { -webkit-tap-highlight-color: transparent; }
      button { font: inherit; }
      input { -webkit-appearance: none; appearance: none; }
      input:focus-visible, button:focus-visible {
        outline: 2px solid #8DBDC6; outline-offset: 2px;
      }
      input:focus { border-color: #8DBDC6 !important; }
      ::selection { background: #8DBDC6; color: #183B4D; }
      button { transition: opacity .15s ease, transform .15s ease; }
      button:active { opacity: 0.72; }

      @keyframes auftauchen {
        from { opacity: 0; transform: translateY(10px); }
        to   { opacity: 1; transform: none; }
      }
      @keyframes routeZeichnen {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      @keyframes pinAuftauchen {
        from { opacity: 0; }
        to   { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: .001ms !important;
          transition-duration: .001ms !important;
        }
      }

      #laden {
        min-height: 100vh; display: grid; place-items: center; background: #FAFAF7;
      }
      #laden span {
        font-family: 'DM Sans', 'Helvetica Neue', Arial, sans-serif; font-weight: 700;
        font-size: 30px; color: #183B4D; letter-spacing: -0.02em;
      }

      @media print {
        nav, button, .no-print { display: none !important; }
        body, #root { background: #fff !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"><div id="laden"><span>Klarschiff</span></div></div>

    <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js" crossorigin></script>
    <script type="text/babel" data-presets="react" src="./app.jsx?v=31"></script>

    <script>
      /* Offline-Betrieb einschalten */
      if ("serviceWorker" in navigator && location.protocol === "https:") {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("./sw.js").then(function (reg) {
            reg.update();
          }).catch(function () {});
        });
      }
    </script>
  </body>
</html>
